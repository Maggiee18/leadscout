# Local production-like stack: LeadScout + PostgreSQL.
#   cp .env.example .env   (add GROQ_API_KEY)   then:   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leadscout
      POSTGRES_USER: leadscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadscout -d leadscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://leadscout:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/leadscout
      APP_URL: ${APP_URL:-http://localhost:8000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # plain http on localhost
    ports:
      - "8000:8000"

volumes:
  pgdata:
