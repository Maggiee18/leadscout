line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = [
  "S101",  # assert is fine in tests
  "S608",  # SQL is built from fixed fragments; all values are bound parameters
  "B008",  # FastAPI Depends()/File() in defaults is the documented pattern
  "UP017", # keep timezone.utc for Python 3.10 compatibility
]

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"scripts/*" = ["S310"]
"scorer.py" = ["E501"]  # the LLM prompt is a long literal on purpose
