# Render Blueprint: one web service. See README "Deploy on Render".
services:
  - type: web
    name: leadscout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false          # paste in the Render dashboard; never commit it
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: APP_URL
        sync: false          # e.g. https://leadscout.onrender.com (used in reset emails)
      # Password reset email (optional). Gmail: smtp.gmail.com, 587, your address, an App Password
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Accounts and lead history survive redeploys only with Postgres. Uncomment
      # this and the database below to have Render create and connect one.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: leadscout-db
      #     property: connectionString

# databases:
#   - name: leadscout-db
#     plan: free
